<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Συνολικά αποτελέσματα | CCTV</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-hero">
    <div class="container page-hero-content">
      <h1>Συνολικά αποτελέσματα</h1>
      <p>Η σελίδα παρουσιάζει συγκεντρωτικά τις συμμετοχές όλων των ατόμων που ολοκλήρωσαν το ερωτηματολόγιο.</p>
    </div>
  </header>

  <main>
    <section class="section section-light">
      <div class="container">
        <div class="intro-card intro-card-centered">
          <div class="section-intro">
            <h2>Καταγεγραμμένες συμμετοχές</h2>
            <p id="total-count">Φόρτωση αποτελεσμάτων…</p>
            <div id="winner-box" class="aggregate-conclusion"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-soft">
      <div class="container">
        <div class="section-intro">
          <h2>Κατανομή συμμετεχόντων</h2>
          <p>Κάθε ολοκληρωμένο ερωτηματολόγιο μετρά ως μία συμμετοχή.</p>
        </div>
        <div id="profile-stats" class="stats-grid"></div>
      </div>
    </section>

    <section class="section section-light">
      <div class="container callout-center result-actions">
        <a class="button" href="profiles.html">Νέα συμμετοχή</a>
        <a class="button button-light-outline" href="index.html">Αρχική</a>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
    const labels = {
      beginner: "Δεν γνωρίζω σχεδόν τίποτα",
      intermediate: "Γνωρίζω κάποια βασικά",
      advanced: "Τα χρησιμοποιώ ή εργάζομαι με αυτά"
    };

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadStatistics() {
      const totalEl = document.getElementById("total-count");
      const winnerEl = document.getElementById("winner-box");
      const statsEl = document.getElementById("profile-stats");
      const apiUrl = window.CCTV_ONLINE_API_URL || "";

      if (!apiUrl || apiUrl.includes("ΒΑΛΕ_ΕΔΩ")) {
        totalEl.textContent = "Η online συλλογή δεν έχει ρυθμιστεί ακόμη.";
        winnerEl.innerHTML = "<p>Δεν έχει οριστεί το URL του Google Apps Script στο config.js.</p>";
        return;
      }

      const callbackName = `cctvResults_${Date.now()}_${Math.random().toString(36).slice(2)}`;
      const script = document.createElement("script");
      script.async = true;
      let finished = false;
      let timeout;

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      function showError(message) {
        if (finished) return;
        finished = true;
        cleanup();
        totalEl.textContent = "Δεν ήταν δυνατή η φόρτωση των συνολικών αποτελεσμάτων.";
        winnerEl.innerHTML = `<p>${escapeHtml(message)}</p>`;
        statsEl.innerHTML = "";
      }

      window[callbackName] = (stats) => {
        if (finished) return;
        if (!stats || typeof stats !== "object" || typeof stats.total !== "number" || !stats.profiles) {
          showError("Το Google Apps Script επέστρεψε μη έγκυρα δεδομένα.");
          return;
        }

        finished = true;
        cleanup();

        const entries = Object.entries(stats.profiles)
          .filter(([key]) => Object.prototype.hasOwnProperty.call(labels, key))
          .map(([key, count]) => [key, Number(count) || 0]);
        const total = Number(stats.total) || 0;
        totalEl.textContent = `Συνολικές συμμετοχές: ${total}`;

        const max = entries.length ? Math.max(...entries.map(([, count]) => count)) : 0;
        const winners = entries.filter(([, count]) => count === max && max > 0);

        if (!total) {
          winnerEl.innerHTML = `
            <h3>Δεν υπάρχει ακόμη διαθέσιμο δείγμα.</h3>
            <p>Μόλις καταγραφούν συμμετοχές, θα εμφανιστεί αυτόματα το συμπέρασμα.</p>
          `;
        } else if (winners.length > 1) {
          winnerEl.innerHTML = `
            <h3>Υπάρχει ισοπαλία.</h3>
            <p>Οι μεγαλύτερες ομάδες είναι ${winners.map(([key]) => `<strong>${escapeHtml(labels[key])}</strong>`).join(", ")} με ${max} συμμετοχές.</p>
          `;
        } else {
          const [key, count] = winners[0];
          const pct = Math.round((count / total) * 100);
          winnerEl.innerHTML = `
            <h3>Συμπέρασμα</h3>
            <p>Η πολυπληθέστερη ομάδα είναι <strong>${escapeHtml(labels[key])}</strong>, με <strong>${count}</strong> από τις ${total} συμμετοχές (${pct}%).</p>
          `;
        }

        statsEl.innerHTML = entries.map(([key, count]) => {
          const pct = total ? Math.round((count / total) * 100) : 0;
          return `
            <article class="stat-card">
              <h3>${escapeHtml(labels[key])}</h3>
              <div class="stat-number">${count}</div>
              <p>${pct}% των συμμετοχών</p>
              <div class="stat-bar"><span style="width:${pct}%"></span></div>
            </article>
          `;
        }).join("");
      };

      script.onerror = () => showError("Δεν ήταν δυνατή η σύνδεση με το Google Apps Script.");
      timeout = setTimeout(() => showError("Η φόρτωση των αποτελεσμάτων άργησε περισσότερο από το αναμενόμενο. Δοκίμασε ξανά."), 15000);

      const separator = apiUrl.includes("?") ? "&" : "?";
      script.src = `${apiUrl}${separator}action=statistics&callback=${encodeURIComponent(callbackName)}&t=${Date.now()}`;
      document.head.appendChild(script);
    }

    loadStatistics();
  </script>
</body>
</html>
